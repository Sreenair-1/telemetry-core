
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      role: telemetry
  template:
    metadata:
      labels:
        role: telemetry
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-telemetry-service
spec:
  type: NodePort
  selector:
    role: telemetry
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30095
